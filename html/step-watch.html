<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mirror 21">
<!-- Dark screen: Safari's bar turns black here only; the rest of the app stays white. -->
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<title>Mirror 21 · Step · Watch</title>
<!-- Built from the Watch screen design handoff, index.html (locked design): Start → Mid → Finish. -->
<link rel="stylesheet" href="../assets/step/tokens.css?v=20261021-signin">
<link rel="stylesheet" href="../assets/step/watch.css?v=20261021-signin">
<!-- Opened from the map's step card: start on black; from the check-in: start on white, with Safari's
     bar white too. Set before the first paint (step.js runs the sequence). -->
<script>try { const note = sessionStorage.getItem('mirror21-intro'); if (note !== null) document.documentElement.classList.add('intro'); if (note && note.startsWith('light:')) { document.documentElement.classList.add('intro-light'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff'); } } catch {}</script>
<script src="../assets/progress.js?v=20261021-signin" defer></script>
<script src="../assets/steps.js?v=20261021-signin" defer></script>
<script src="../assets/step/step.js?v=20261021-signin" defer></script>
</head>
<body data-screen="watch">
<main class="watch" id="watch" data-state="start">
  <img class="still" id="still" alt="">
  <!-- playsinline: the video plays in the page, never in Apple's full-screen player. -->
  <video class="media" id="player" playsinline webkit-playsinline preload="metadata"></video>

  <div class="fade top"></div><div class="fade bottom"></div><div class="fade end"></div>

  <a class="close" href="04-map-start.html" aria-label="Close step">
    <svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16"/></svg>
  </a>
  <div class="steps" id="stepBar" role="progressbar" aria-label="Step progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

  <div class="heading">
    <p class="meta"><span id="stepLabel">STEP 01 OF 21</span><span class="done">&nbsp;&nbsp;·&nbsp;&nbsp;WATCHED&nbsp;&nbsp;✓</span></p>
    <h1 class="title" id="stepTitle">KNOW WHERE YOU ARE GOING.</h1>
  </div>

  <button class="play" id="play" aria-label="Play video">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2.5v19l16-9.5z" fill="#fff"/></svg>
  </button>

  <p class="hint" id="hint">
    <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.4" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#fff"/><path d="M11.5 5.5a3.5 3.5 0 010 5"/></svg>
    <span id="hintText">BEST WITH SOUND</span>
  </p>

  <div class="line"><i id="line"></i></div>
  <p class="soon">VIDEO COMING SOON</p>

  <div class="end">
    <button class="again" id="again">↻&nbsp;&nbsp;WATCH AGAIN</button>
    <a class="learn" id="next" href="step-learn.html"><b id="nextLabel">LEARN</b></a>
  </div>
</main>
</body>
</html>
