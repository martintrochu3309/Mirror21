<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mirror 21">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<title>Mirror 21 · Step · Watch</title>
<!-- Built from the Step 01 design handoff, watch.html (locked design). -->
<link rel="stylesheet" href="../assets/step/tokens.css?v=20261020-app">
<link rel="stylesheet" href="../assets/step/step.css?v=20261020-app">
<link rel="stylesheet" href="../assets/step/step-app.css?v=20261020-app">
<script src="../assets/progress.js?v=20261020-app" defer></script>
<script src="../assets/steps.js?v=20261020-app" defer></script>
<script src="../assets/step/step.js?v=20261020-app" defer></script>
</head>
<body data-screen="watch">
<main class="screen" id="watch">

  <div class="topbar">
    <a class="icon-btn" href="04-map-start.html" aria-label="Close step">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div class="course-progress" role="progressbar" aria-label="Step progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="course-progress-fill"></span></div>
  </div>

  <div class="chip-row">
    <div class="chip">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
    </div>
    <div class="chip-label">WATCH</div>
  </div>

  <div class="step-label" id="stepLabel">STEP 01</div>
  <h1 class="title" id="stepTitle">KNOW WHERE YOU’RE GOING.</h1>

  <div class="video" id="video">
    <img id="poster" src="../assets/images/step01-poster.jpg" alt="Kevin Craggs, Step 01 video">
    <!-- No playsinline: on iPhone the video opens in Apple's full-screen player. -->
    <video id="player" preload="metadata"></video>
    <button class="play" id="play" aria-label="Play video">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
    <div class="watched-tag">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e0b84c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      WATCHED
    </div>
  </div>

  <div class="spacer"></div>

  <a class="btn btn--outline" id="next" href="step-learn.html">
    <span id="nextLabel">LEARN</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</main>
</body>
</html>
