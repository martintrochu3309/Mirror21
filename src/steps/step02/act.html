<title>Mirror 21 · Step 02 · Act</title>
<!-- Built from the Step 02 design handoff, act.html (locked design). -->
<link rel="stylesheet" href="../assets/step/tokens.css">
<link rel="stylesheet" href="../assets/step/step.css">
<link rel="stylesheet" href="../assets/step/step02.css">
<link rel="stylesheet" href="../assets/step/step-app.css">
<!--#scripts-step screen="act"-->
</head>
<body data-screen="act">
<main class="screen act--plain">

  <!--#step-topbar-->


  <!-- No STEP label, title or intro: the page opens straight on 01. The heading is for screen readers only. -->
  <h1 class="sr-only">Your turn</h1>

  <div class="rows">

    <!-- 01 THERE — read-only, from the step before (always done) -->
    <section class="row row-static is-done">
      <div class="row-body">
        <p class="row-head"><span class="q-num">01</span><span class="row-key">WHERE I’M GOING</span></p>
        <div class="from"><span data-from-step>FROM STEP 01</span></div>
        <p class="mine-text" data-from="there" data-starter="I want to be able to"></p>
      </div>
    </section>

    <!-- 02 PROOF — my action + proof check -->
    <section class="row" id="rowAction">
      <div class="row-body">
        <p class="row-head"><span class="q-num">02</span><span class="row-key">PROOF</span></p>
        <label class="question" for="action">My action</label>
        <p class="prompt">Make it something you could prove you did.</p>
        <p class="hint" id="proofHint" hidden>If you couldn’t prove it, it’s still an intention. Make it something you either do or don’t.</p>
        <div class="starter-wrap">
          <span class="starter" id="starter" aria-hidden="true">Today I will </span>
          <textarea autocapitalize="off" class="answer-box" id="action" rows="3" maxlength="200" aria-label="My action. Today I will"></textarea>
        <div class="next-row" id="nextRow" style="display: flex">
          <button class="next" id="next" aria-label="Next" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        </div>
        <div id="proofQ" hidden>
          <p class="proof-q">COULD YOU PROVE YOU DID IT?</p>
          <div class="pills" style="margin-top: 14px">
            <button class="pill pill--ink" id="proofYes">YES</button>
            <button class="pill pill--outline" id="proofNotSure">NOT SURE</button>
          </div>
        </div>
        <button class="proved" id="proved" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#896a00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          Yes, I could prove it.
        </button>
      </div>
    </section>

    <!-- 03 ONCE — my promise -->
    <section class="row is-locked" id="rowPromise">
      <div class="row-body">
        <p class="row-head"><span class="q-num">03</span><span class="row-key">ONCE</span></p>
        <p class="question">My promise</p>
        <p class="promise" aria-live="polite">Today, I will <span class="promise-rest is-empty" id="promiseRest">…</span></p>

        <!--#act-commit locked="Your promise is locked. Step 03 starts by asking how it went."-->
      </div>
    </section>
  </div>
</main>
</body>
</html>
