<title>Mirror 21 · Step 07 · Act</title>
<!-- Step 07 · Link it to your day. Same layout as Step 03, with two read-only rows and no check. -->
<link rel="stylesheet" href="../assets/step/tokens.css">
<link rel="stylesheet" href="../assets/step/step.css">
<link rel="stylesheet" href="../assets/step/step02.css">
<link rel="stylesheet" href="../assets/step/step03.css">
<link rel="stylesheet" href="../assets/step/step-app.css">
<!--#scripts-step screen="act"-->
</head>
<body data-screen="act">
<main class="screen act--plain">

  <!--#step-topbar-->

  <!-- No STEP label, title or intro: the page opens straight on 01. The heading is for screen readers only. -->
  <h1 class="sr-only">Your turn</h1>

  <div class="rows">

    <!-- 01 THERE — read-only, from Step 01 (always done) -->
    <section class="row row-static is-done" data-from-of="1">
      <div class="row-body">
        <p class="row-head"><span class="q-num">01</span><span class="row-key">WHERE I’M GOING</span></p>
        <div class="from"><span data-from-step>FROM STEP 01</span></div>
        <p class="mine-text" data-from="there" data-starter="I want to be able to"></p>
      </div>
    </section>

    <!-- 02 MY MOVE — read-only, from Step 03, in the user's own words (always done) -->
    <section class="row row-static is-done" data-from-of="3">
      <div class="row-body">
        <p class="row-head"><span class="q-num">02</span><span class="row-key">MY MOVE</span></p>
        <div class="from"><span data-from-step>FROM STEP 03</span></div>
        <p class="mine-text" data-from="move" data-starter="My move is"></p>
      </div>
    </section>

    <!-- 03 ANCHOR — something already done every day -->
    <section class="row" id="rowOne">
      <div class="row-body">
        <p class="row-head"><span class="q-num">03</span><span class="row-key">ANCHOR</span></p>
        <label class="question" for="boxOne">My anchor</label>
        <p class="prompt">Something you do every day at the time your action needs to happen.</p>
        <div class="starter-wrap">
          <span class="starter" aria-hidden="true">Every day, I </span>
          <textarea autocapitalize="off" class="answer-box" id="boxOne" data-answer="ANCHOR" rows="3" maxlength="200" aria-label="My anchor. Every day, I"></textarea>
        <!--#next-arrow row="one" row="one"-->
        </div>
      </div>
    </section>

    <!-- 04 ATTACH — my action, straight after the anchor (no check: the arrow goes to MY PROMISE) -->
    <section class="row is-locked" id="rowTwo">
      <div class="row-body">
        <p class="row-head"><span class="q-num">04</span><span class="row-key">ATTACH</span></p>
        <label class="question" for="boxTwo">My action</label>
        <p class="prompt">What you’ll do straight after it.</p>
        <div class="starter-wrap">
          <span class="starter" aria-hidden="true">Straight after, I will </span>
          <textarea autocapitalize="off" class="answer-box" id="boxTwo" data-answer="ACTION" rows="3" maxlength="200" aria-label="My action. Straight after, I will"></textarea>
        <!--#next-arrow-hidden row="two" row="two"-->
        </div>
      </div>
    </section>

    <!-- MY PROMISE — built from MY ANCHOR and MY ACTION, locked with I'M COMMITTED -->
    <section class="row is-locked" id="rowPromise">
      <div class="row-body">
        <p class="promise-title">MY PROMISE</p>
        <p class="promise" id="promise" aria-live="polite">Today, after I <span class="promise-rest is-empty">…</span>, I will <span class="promise-rest is-empty">…</span>.</p>

        <!--#act-commit locked=""-->
      </div>
    </section>
  </div>
</main>
</body>
</html>
