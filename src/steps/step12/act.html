<title>Mirror 21 · Step 12 · Act</title>
<!-- Step 12 · Set a minimum. Same layout as Step 03, with two read-only rows, one box and no check. -->
<link rel="stylesheet" href="../assets/step/tokens.css">
<link rel="stylesheet" href="../assets/step/step.css">
<link rel="stylesheet" href="../assets/step/step02.css">
<link rel="stylesheet" href="../assets/step/step03.css">
<link rel="stylesheet" href="../assets/step/step-app.css">
<!--#scripts-step screen="act"-->
</head>
<body data-screen="act">
<main class="screen act--plain">

  <!--#step-topbar-->

  <!-- No STEP label, title or intro: the page opens straight on 01. The heading is for screen readers only. -->
  <h1 class="sr-only">Your turn</h1>

  <div class="rows">

    <!-- 01 THERE — read-only, from Step 01 (always done) -->
    <section class="row row-static is-done">
      <div class="row-body">
        <p class="row-head"><span class="q-num">01</span><span class="row-key">WHERE I’M GOING</span></p>
        <div class="from"><span data-from-step>FROM STEP 01</span></div>
        <p class="mine-text" data-from="there" data-starter="I want to be able to"></p>
      </div>
    </section>

    <!-- 02 MY MOVE — read-only, from Step 03 -->
    <section class="row row-static is-done" data-from-of="3">
      <div class="row-body">
        <p class="row-head"><span class="q-num">02</span><span class="row-key">MY MOVE</span></p>
        <div class="from"><span data-from-step>FROM STEP 03</span></div>
        <p class="mine-text" data-from="move" data-starter="My move is"></p>
      </div>
    </section>

    <!-- 03 SHRINK — my minimum (no check: the arrow goes to MY PROMISE) -->
    <section class="row" id="rowOne">
      <div class="row-body">
        <p class="row-head"><span class="q-num">03</span><span class="row-key">SHRINK</span></p>
        <label class="question" for="boxOne">My minimum</label>
        <p class="prompt">The same action and the same target, just less of it.</p>
        <div class="starter-wrap">
          <span class="starter" aria-hidden="true">On a bad day, the least I will do is </span>
          <textarea autocapitalize="off" class="answer-box" id="boxOne" data-answer="MINIMUM" rows="3" maxlength="200" aria-label="My minimum. On a bad day, the least I will do is"></textarea>
        <!--#next-arrow row="one" row="one"-->
        </div>
      </div>
    </section>

    <!-- MY PROMISE — built from MY MINIMUM, locked with I'M COMMITTED -->
    <section class="row is-locked" id="rowPromise">
      <div class="row-body">
        <p class="promise-title">MY PROMISE</p>
        <p class="promise" id="promise" aria-live="polite">Today, I will do my move, or at least <span class="promise-rest is-empty">…</span>.</p>

        <!--#act-commit locked=""-->
      </div>
    </section>
  </div>
</main>
</body>
</html>
